<!DOCTYPE html>
<html>
<head>
    <title>Галерея</title>
    <style>
        /* Оставляем только стили для бегущей строки и фото */
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f0f0f0; }
        img { max-width: 600px; height: auto; border: 3px solid #ccc; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        /* Стили бегущей строки */
        .ticker {
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
            background-size: 300% 100%;
            color: #fff;
            font-weight: bold;
            font-size: 1.5em;
            padding: 15px 0;
            margin: 20px 0 30px 0;
            border-radius: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            overflow: hidden;
            white-space: nowrap;
            animation: gradientMove 4s linear infinite;
        }

        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: tickerScroll 20s linear infinite;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200%); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Оставляем только бегущую строку -->
        <div class="ticker">
            <span class="ticker-content">
                🚀 Я!!! СТАНУ КРУТЫМ КРУТЫМ DEVOPS-ИНЖЕНЕРОМ! 💻
                ДЕВОПС — ЭТО НЕ ПРОФЕССИЯ, ЭТО ОБРАЗ ЖИЗНИ! 🔥
            </span>
        </div>

        <!-- Оставляем отображение фото -->
        {% if current_photo %}
            {% load static %}
            <img src="{% static 'images/'|add:current_photo %}" alt="Фото">
        {% else %}
            <p>📷 Фото не найдено</p>
        {% endif %}

        <!-- Оставляем навигацию -->
        <div class="controls">
            {% if has_prev %}
                <a href="?i={{ prev_index }}">⬅️ Назад</a>
            {% endif %}

            {% if has_next %}
                <a href="?i={{ next_index }}">Вперед ➡️</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
