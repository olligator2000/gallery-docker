# ============================================================
# 1. Название workflow
# ============================================================
name: Build, Push and Deploy

# ============================================================
# 2. Триггеры
# ============================================================
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# ============================================================
# 3. Переменные окружения
# ============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: olligator2000/gallery-docker

# ============================================================
# 4. Задания
# ============================================================
jobs:

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← нужно для пуша изменений в репозиторий
      packages: write
      attestations: write
      id-token: write

    steps:

    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🔑 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=,format=short

    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # ------------------------------------------
    # 🚀 Обновляем манифест для Argo CD
    # ------------------------------------------
    - name: 🚀 Update Kubernetes manifest for Argo CD
      if: github.event_name != 'pull_request'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        SHA_SHORT="${{ github.sha }}"

        if [[ "${{ github.ref_name }}" == "develop" ]]; then
          MANIFEST="k8s/web-staging-deployment.yaml"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          MANIFEST="k8s/web-production-deployment.yaml"
        else
          echo "⚠️ Неизвестная ветка: ${{ github.ref_name }}"
          exit 0
        fi

        if [[ ! -f "$MANIFEST" ]]; then
          echo "❌ Файл $MANIFEST не найден в корне репозитория!"
          echo "   Проверьте путь и исправьте в workflow."
          exit 0
        fi

        echo "📝 Обновляем $MANIFEST (commit: $SHA_SHORT)"

        # Обновляем аннотацию change-cause (заставит Argo CD увидеть изменение)
        if grep -q "kubernetes.io/change-cause" "$MANIFEST"; then
          sed -i "s|kubernetes.io/change-cause:.*|kubernetes.io/change-cause: \"Build $TIMESTAMP ($SHA_SHORT)\"|" "$MANIFEST"
        else
          sed -i "/^metadata:/a\\  annotations:\n    kubernetes.io/change-cause: \"Build $TIMESTAMP ($SHA_SHORT)\"" "$MANIFEST"
        fi

        git add "$MANIFEST"
        git commit -m "chore: update $MANIFEST for $SHA_SHORT [skip ci]" || echo "No changes to commit"
        git push

    # ------------------------------------------
    # 🚀 Отправка webhook на сервер (старая схема)
    # ------------------------------------------
    - name: 🚀 Send webhook to server
      if: github.event_name != 'pull_request'
      run: |
        # Определяем, какая ветка и какой внутренний порт
        if [[ "${{ github.ref_name }}" == "develop" ]]; then
          BRANCH="develop"
          DEPLOY_PATH="/home/${{ secrets.SERVER_USER }}/docker_dev"
          INTERNAL_PORT="8000"
          IMAGE_TAG="develop"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          BRANCH="main"
          DEPLOY_PATH="/home/${{ secrets.SERVER_USER }}/docker_prod"
          INTERNAL_PORT="8001"
          IMAGE_TAG="latest"
        else
          echo "⚠️ Неизвестная ветка: ${{ github.ref_name }}"
          exit 0
        fi

        IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

        echo "📦 Отправляем webhook для ветки $BRANCH"
        echo "   Образ: $IMAGE_FULL"
        echo "   Путь: $DEPLOY_PATH"
        echo "   Порт: $INTERNAL_PORT"

        curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "branch": "'"$BRANCH"'",
            "image": "'"$IMAGE_FULL"'",
            "deploy_path": "'"$DEPLOY_PATH"'",
            "port": '"$INTERNAL_PORT"',
            "commit": "'"${{ github.sha }}"'"
          }' \
          http://${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PORT }}/webhook

        echo "✅ Webhook отправлен!"

    # ------------------------------------------
    # 📨 Отправка уведомления в Telegram
    # ------------------------------------------
    - name: 📨 Send Telegram notification
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          STATUS="✅ УСПЕШНО"
          EMOJI="✅"
        else
          STATUS="❌ ОШИБКА"
          EMOJI="❌"
        fi

        if [[ "${{ github.ref_name }}" == "develop" ]]; then
          ENV="🟡 STAGING"
          EXTERNAL_PORT="38000"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          ENV="🟢 PRODUCTION"
          EXTERNAL_PORT="38001"
        else
          ENV="🔵 UNKNOWN"
          EXTERNAL_PORT="?"
        fi

        HOST="s1.moloko62.ru"

        MESSAGE="
        ${EMOJI} *Деплой ${STATUS}* ${ENV}

        📦 *Проект:* gallery-docker
        🌿 *Ветка:* ${{ github.ref_name }}
        🔗 *Коммит:* ${{ github.sha }}
        👤 *Автор:* ${{ github.actor }}
        🌐 *Ссылка:* http://${HOST}:${EXTERNAL_PORT}
        🕐 *Время:* $(date '+%Y-%m-%d %H:%M:%S')
        "

        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="$MESSAGE" \
          -d parse_mode="Markdown"

    # ------------------------------------------
    # 🩺 Проверка healthcheck через HTTP
    # ------------------------------------------
    - name: 🩺 Check health via HTTP
      if: success()
      run: |
        if [[ "${{ github.ref_name }}" == "develop" ]]; then
          EXTERNAL_PORT="38000"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          EXTERNAL_PORT="38001"
        else
          EXTERNAL_PORT="8000"
        fi

        sleep 5

        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://s1.moloko62.ru:${EXTERNAL_PORT}/ || echo "000")

        if [[ "$HTTP_CODE" == "200" ]]; then
          STATUS_EMOJI="🟢"
          STATUS="healthy ✅ (HTTP 200)"
        elif [[ "$HTTP_CODE" == "000" ]]; then
          STATUS_EMOJI="🔴"
          STATUS="unhealthy ❌ (контейнер не отвечает)"
        else
          STATUS_EMOJI="🟡"
          STATUS="⚠️ странный ответ (HTTP ${HTTP_CODE})"
        fi

        MESSAGE="
        ${STATUS_EMOJI} *Healthcheck для gallery-${{ github.ref_name }}*

        📊 *Статус:* ${STATUS}
        🌿 *Ветка:* ${{ github.ref_name }}
        🌐 *Ссылка:* http://s1.moloko62.ru:${EXTERNAL_PORT}
        🕐 *Время:* $(date '+%Y-%m-%d %H:%M:%S')
        "

        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="$MESSAGE" \
          -d parse_mode="Markdown"