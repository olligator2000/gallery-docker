# Версия формата docker-compose (современная, можно не указывать)
# Но для совместимости пишем 3.8
version: '3.8'

# Описываем сервисы (контейнеры), которые будем запускать
services:
  # Название сервиса — web (будет доступен как хост внутри сети контейнеров)
  web:
    # Собирать образ из текущей папки (ищет Dockerfile)
    build: .

    # Пробрасываем порты: "порт_хоста:порт_контейнера"
    # Порт 8000 на твоём ПК будет направлен на порт 8000 внутри контейнера
    ports:
      - "8000:8000"

    # Монтируем текущую папку проекта внутрь контейнера
    # Это позволяет менять код без пересборки образа
    # . — текущая папка на хосте
    # /app — папка внутри контейнера, куда монтируем
    volumes:
      - .:/app

    # (Опционально) Команда запуска — если не указана, используется CMD из Dockerfile
    # command: python manage.py runserver 0.0.0.0:8000